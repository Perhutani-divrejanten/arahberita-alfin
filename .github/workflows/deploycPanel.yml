name: Deploy ke cPanel

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static generator
        run: node tools/generate.js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /arahberita/
          timeout: 120000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tools/**
            **/*.bak*
            **/*.ipynb
            **/*.ps1
            **/*.py
            **/*.log
            **/.env*
            articles_temp.json
            .DS_Store
            AUDIT_REPORT.md
            AUTOMATION_README.md
            GOOGLE_DRIVE_GUIDE.md
            GOOGLE_DRIVE_IMAGES_GUIDE.md
            LICENSE.txt
            READ-ME.txt
            SEARCH_SETUP.md
